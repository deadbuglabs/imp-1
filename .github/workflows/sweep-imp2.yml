# IMP-2 routing sweep — parallel sandbox matrix on GitHub Actions.
#
# Purpose: run the IMP-2 interactive-pass families (i2a/i2b/i2c/i2d) against
# Freerouting variants in parallel, each in its own job, and report DRC
# numbers live to the `sweep-results` branch (namespaced `results/imp2/`)
# so a watcher can update the Four Windows Space while the sweep is still
# running.
#
# Reference board: IMP-2 layout pass 2, 134 unconnected / 0 shorts /
# 12 clearance (the 12 fenced at U12's 0.4 mm-pitch pads). The board is NOT
# DRC-clean and NOT fab-ready. Finish line is DRC-clean (0/0/0); beating
# 134 is progress, not a pass. No fab, no orders, no gate PASS.
#
# HOW THIS FILE LANDS: the Muse GitHub App CANNOT create/edit anything
# under .github/workflows/ (403, lacks Workflows permission). This file is
# prepared in the workspace and must be added VIA THE BROWSER by a human
# (or an agent with browser access): repo deadbuglabs/imp-1, path
# .github/workflows/sweep-imp2.yml, commit message
# "Add IMP-2 routing sweep workflow (sweep-imp2)". Verify in the repo
# Actions tab that "IMP-2 routing sweep" appears, then run it once via
# workflow_dispatch with families=i2a variants=fr-mp1 as a smoke check.
# Do NOT claim this workflow is live until it is verifiably in the repo.
#
# Triggers:
#   - workflow_dispatch: full matrix (families x variants, order = most
#     promising first). Inputs let the dispatcher narrow the matrix.
#   - push to this file: toolchain smoke job ONLY (proves install + DRC +
#     live-results commit). The matrix never runs on push.
#   - schedule '0 */4 * * *': full matrix every 4 hours.
#
# Free-tier safety: public repo, ubuntu-24.04 runners, no paid actions,
# no secrets. Max-parallel: 4 families x 4 variants = 16 jobs at once
# (public-repo concurrency is 20). No cap, no serialization. Toolchain
# installs are cached between runs (apt archives + Freerouting jar).
# Fail-fast lives per job (placement gate + stage gate), never at the
# matrix level. Each sweep job is capped at 90 min so a hung router
# cannot burn the run. No live snapshots: the v1 matrix is Freerouting-only
# and Freerouting writes its .ses only at the end, so there are no
# mid-route checkpoints to watch (see tools/sweep-imp2/README-imp2.md).

name: IMP-2 routing sweep

on:
  workflow_dispatch:
    inputs:
      families:
        description: 'Families to run, comma-separated, most promising first'
        required: false
        default: 'i2a,i2b,i2c,i2d'
      variants:
        description: 'Router variants, comma-separated, most promising first'
        required: false
        default: 'fr-mp3,fr-mp1,fr-mp3-finevia,fr-mp3-edge'
  push:
    paths:
      - '.github/workflows/sweep-imp2.yml'
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

env:
  KICAD_VERSION_WANT: '7.0'
  FREEROUTING_VERSION: '1.9.0'
  FREEROUTING_JAR_URL: 'https://github.com/freerouting/freerouting/releases/download/v1.9.0/freerouting-1.9.0.jar'
  FREEROUTING_JAR_SIZE: '5044336'
  IMP2_UNCONNECTED: '134'
  IMP2_SHORTS: '0'
  IMP2_CLEARANCE: '12'

jobs:
  setup:
    name: Build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      family_count: ${{ steps.build.outputs.family_count }}
      variant_count: ${{ steps.build.outputs.variant_count }}
    steps:
      - id: build
        run: |
          python3 - <<'PY'
          import json, os
          fams = [f.strip() for f in os.environ.get('FAMILIES', 'i2a,i2b,i2c,i2d').split(',') if f.strip()]
          vars_ = [v.strip() for v in os.environ.get('VARIANTS', 'fr-mp3,fr-mp1,fr-mp3-finevia,fr-mp3-edge').split(',') if v.strip()]
          combos = [{'family': f, 'variant': v} for f in fams for v in vars_]
          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a') as fh:
              fh.write('matrix=' + json.dumps({'include': combos}) + '\n')
              fh.write('family_count=%d\n' % len(fams))
              fh.write('variant_count=%d\n' % len(vars_))
          print('matrix: %d jobs (%d families x %d variants)' % (len(combos), len(fams), len(vars_)))
          PY
        env:
          FAMILIES: ${{ inputs.families || 'i2a,i2b,i2c,i2d' }}
          VARIANTS: ${{ inputs.variants || 'fr-mp3,fr-mp1,fr-mp3-finevia,fr-mp3-edge' }}

  toolchain:
    name: Toolchain smoke (IMP-2 DRC + live results)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore apt cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-archives
          key: apt-kicad7-java21-${{ runner.os }}-v1
      - name: Install KiCad 7 + Java 21 + Xvfb
        run: |
          set -e
          mkdir -p "$HOME/.cache/apt-archives"
          sudo apt-get update -qq
          sudo apt-get -o Dir::Cache::archives="$HOME/.cache/apt-archives" install -y -qq kicad xvfb openjdk-21-jre curl jq > /tmp/apt.log 2>&1
          kicad-cli version
          java -version 2>&1 | head -1
          python3 - <<'PY'
          import os, subprocess, sys
          cands = ['/usr/lib/kicad/lib/python3/dist-packages',
                   '/usr/lib/python3/dist-packages',
                   '/usr/lib/kicad/python3/dist-packages']
          found = None
          for d in cands:
              if os.path.exists(os.path.join(d, 'pcbnew.py')):
                  found = d
                  break
          if found is None:
              print('pcbnew.py not found in', cands)
              sys.exit(1)
          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              fh.write('PYTHONPATH=%s:%s\n' % (found, os.environ.get('PYTHONPATH', '')))
          print('pcbnew at', found)
          PY
          python3 -c "import pcbnew; print('pcbnew OK', pcbnew.Version())"
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2
          xdpyinfo -display :99 > /dev/null 2>&1 || (echo 'Xvfb did not come up'; cat /tmp/xvfb.log; exit 1)
          echo 'Xvfb up on :99'
      - name: DRC the IMP-2 reference board
        run: |
          set -e
          mkdir -p out
          cp hardware/pcb/imp2/imp2_layout.kicad_pcb hardware/pcb/imp2/imp2_layout.kicad_pro out/
          xvfb-run -a python3 tools/sweep-imp2/drc.py out/imp2_layout.kicad_pcb out/imp2_drc.txt
          python3 tools/sweep-imp2/parse_drc.py out/imp2_drc.txt out/imp2_counts.json
          cat out/imp2_counts.json
      - name: Write + push live results
        run: |
          set -e
          python3 tools/sweep-imp2/write_results_imp2.py \
            --family toolchain --variant imp2-baseline \
            --run-number "${{ github.run_number }}" --run-id "${{ github.run_id }}" \
            --counts out/imp2_counts.json --board out/imp2_layout.kicad_pcb \
            --status toolchain-ok --reason 'IMP-2 baseline DRC reproduced on runner' \
            --out out/toolchain-imp2-baseline.json
          bash tools/sweep-imp2/push-results-imp2.sh out/toolchain-imp2-baseline.json "${{ github.run_number }}" toolchain imp2-baseline
      - name: Job summary
        run: |
          python3 - <<'PY'
          import json, os
          c = json.load(open('out/imp2_counts.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write('## Toolchain smoke — IMP-2 baseline\n\n')
              fh.write('| unconnected | shorts | clearance | total violations |\n|---:|---:|---:|---:|\n')
              fh.write('| %d | %d | %d | %d |\n' % (c['unconnected'], c['shorts'], c['clearance'], c['total']))
              fh.write('\nExpected: 134 / 0 / 12 (clearance fenced at U12). Live result committed to `sweep-results` as `results/imp2/%s/toolchain-imp2-baseline.json`.\n' % '${{ github.run_number }}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-imp2-baseline
          path: |
            out/imp2_drc.txt
            out/imp2_counts.json
            out/toolchain-imp2-baseline.json
          retention-days: 30

  sweep:
    name: Sweep ${{ matrix.family }} / ${{ matrix.variant }}
    needs: setup
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore toolchain cache (apt + Freerouting jar)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/apt-archives
            tools/freerouting
          key: sweep-toolchain-${{ runner.os }}-fr1.9.0-v1
      - name: Install KiCad 7 + Java 21 + Xvfb + Freerouting
        run: |
          set -e
          mkdir -p "$HOME/.cache/apt-archives"
          sudo apt-get update -qq
          sudo apt-get -o Dir::Cache::archives="$HOME/.cache/apt-archives" install -y -qq kicad xvfb openjdk-21-jre curl jq > /tmp/apt.log 2>&1
          kicad-cli version
          python3 - <<'PY'
          import os, sys
          cands = ['/usr/lib/kicad/lib/python3/dist-packages',
                   '/usr/lib/python3/dist-packages',
                   '/usr/lib/kicad/python3/dist-packages']
          found = None
          for d in cands:
              if os.path.exists(os.path.join(d, 'pcbnew.py')):
                  found = d
                  break
          if found is None:
              print('pcbnew.py not found in', cands)
              sys.exit(1)
          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              fh.write('PYTHONPATH=%s:%s\n' % (found, os.environ.get('PYTHONPATH', '')))
          print('pcbnew at', found)
          PY
          python3 -c "import pcbnew; print('pcbnew OK', pcbnew.Version())"
          mkdir -p tools/freerouting
          if [ ! -f tools/freerouting/freerouting.jar ] || [ "$(stat -c%s tools/freerouting/freerouting.jar)" != "$FREEROUTING_JAR_SIZE" ]; then
            curl -sL -o tools/freerouting/freerouting.jar "$FREEROUTING_JAR_URL"
            test "$(stat -c%s tools/freerouting/freerouting.jar)" = "$FREEROUTING_JAR_SIZE"
          fi
          echo 'Freerouting 1.9.0 jar present and size-verified (cache or fresh download)'
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2
          xdpyinfo -display :99 > /dev/null 2>&1 || (echo 'Xvfb did not come up'; cat /tmp/xvfb.log; exit 1)
      - name: Run family variant
        run: |
          bash tools/sweep-imp2/run_variant_imp2.sh "${{ matrix.family }}" "${{ matrix.variant }}" "${{ github.run_number }}" "${{ github.run_id }}"
      - name: Push live results
        if: always()
        run: |
          f="out/${{ matrix.family }}-${{ matrix.variant }}.json"
          test -f "$f" || { echo "no results JSON at $f"; exit 1; }
          bash tools/sweep-imp2/push-results-imp2.sh "$f" "${{ github.run_number }}" "${{ matrix.family }}" "${{ matrix.variant }}"
      - name: Job summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          p = 'out/${{ matrix.family }}-${{ matrix.variant }}.json'
          try:
              r = json.load(open(p))
          except Exception as e:
              print('no results JSON:', e)
              raise SystemExit(0)
          d = r.get('drc') or {}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write('## IMP-2 %s / %s — %s\n\n' % (r['family'], r['variant'], r['status']))
              fh.write('Reason: %s\n\n' % r.get('reason', ''))
              fh.write('| unconnected | shorts | clearance | verdict vs 134/0/12 |\n|---:|---:|---:|---:|\n')
              fh.write('| %s | %s | %s | %s |\n' % (d.get('unconnected', '-'), d.get('shorts', '-'), d.get('clearance', '-'), r.get('verdict_vs_reference', 'n/a')))
              fh.write('\nLive result: `results/imp2/%s/%s-%s.json` on branch `sweep-results`.\n' % ('${{ github.run_number }}', r['family'], r['variant']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-imp2-${{ matrix.family }}-${{ matrix.variant }}
          path: |
            out/
          retention-days: 30

  aggregate:
    name: Aggregate live summary
    needs: [setup, sweep]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-imp2-*
          path: artifacts
          merge-multiple: true
      - name: Merge summary + push
        run: |
          set -e
          python3 - <<'PY'
          import glob, json, os
          files = sorted(glob.glob('artifacts/*-*.json'))
          jobs = []
          for f in files:
              try:
                  r = json.load(open(f))
              except Exception:
                  continue
              if r.get('schema') == 'imp2-sweep-result/1':
                  jobs.append(r)
          jobs.sort(key=lambda r: (r['family'], r['variant']))
          summary = {
              'schema': 'imp2-sweep-summary/1',
              'board': 'imp2',
              'run_number': int(os.environ.get('RUN_NUMBER', '0')),
              'run_id': os.environ.get('RUN_ID', ''),
              'reference': {'unconnected': 134, 'shorts': 0, 'clearance': 12},
              'jobs': jobs,
              'beat_reference': [j['family'] + '/' + j['variant'] for j in jobs if j.get('verdict_vs_reference') == 'beat'],
          }
          os.makedirs('summary-out', exist_ok=True)
          with open('summary-out/summary.json', 'w') as fh:
              json.dump(summary, fh, indent=2)
          print('aggregated %d jobs; beat reference: %s' % (len(jobs), summary['beat_reference']))
          PY
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
      - name: Push summary to sweep-results
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin sweep-results 2>/dev/null || true
          rm -rf /tmp/sweep-results-wt-imp2
          if git rev-parse --verify origin/sweep-results >/dev/null 2>&1; then
            git worktree add /tmp/sweep-results-wt-imp2 sweep-results
          else
            git worktree add --detach /tmp/sweep-results-wt-imp2
            git -C /tmp/sweep-results-wt-imp2 checkout --orphan sweep-results
            git -C /tmp/sweep-results-wt-imp2 rm -rf . 2>/dev/null || true
          fi
          mkdir -p "/tmp/sweep-results-wt-imp2/results/imp2/${{ github.run_number }}/history"
          cp summary-out/summary.json "/tmp/sweep-results-wt-imp2/results/imp2/summary.json"
          cp summary-out/summary.json "/tmp/sweep-results-wt-imp2/results/imp2/history/${{ github.run_number }}-summary.json"
          cd /tmp/sweep-results-wt-imp2
          git add results/imp2/summary.json "results/imp2/history/${{ github.run_number }}-summary.json"
          git commit -m "imp2 sweep summary run ${{ github.run_number }}" || echo 'nothing to commit'
          git push origin sweep-results || (git pull --rebase origin sweep-results && git push origin sweep-results)
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/sweep-results-wt-imp2
